<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Trifold Open Graph card">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="55%" stop-color="#121A26"/>
      <stop offset="100%" stop-color="#1A2740"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <rect x="48" y="48" width="1104" height="534" rx="28" fill="none" stroke="#2A3A52" stroke-width="2"/>

  <!-- mark -->
  <g transform="translate(96,120)">
    <rect width="120" height="120" rx="28" fill="#0B0F14" stroke="#2A3441" stroke-width="3"/>
    <path d="M28 78c10-28 50-28 60 0" fill="none" stroke="#5B8CFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M36 64c8-16 34-16 42 0" fill="none" stroke="#8FB0FF" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="64" cy="42" r="11" fill="#5B8CFF"/>
    <circle cx="64" cy="42" r="4.5" fill="#0B0F14"/>
    <circle cx="32" cy="82" r="5.5" fill="#7CFFB2"/>
    <circle cx="64" cy="90" r="5.5" fill="#FFD27C"/>
    <circle cx="96" cy="82" r="5.5" fill="#FF8FA3"/>
  </g>

  <text x="260" y="175" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="54" font-weight="700" fill="#E8EEF7">Trifold</text>
  <text x="260" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="600" fill="#8FB0FF">Define once. Ship three surfaces.</text>
  <text x="260" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#93A0B4">TypeScript Operation Registry → HTTP · CLI · MCP</text>

  <!-- pills -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">
    <rect x="260" y="360" width="110" height="44" rx="22" fill="#13251C" stroke="#2F5A45"/>
    <text x="290" y="389" fill="#7CFFB2">HTTP</text>
    <rect x="390" y="360" width="90" height="44" rx="22" fill="#2A2114" stroke="#6A542E"/>
    <text x="415" y="389" fill="#FFD27C">CLI</text>
    <rect x="500" y="360" width="100" height="44" rx="22" fill="#2A1520" stroke="#6A3144"/>
    <text x="525" y="389" fill="#FF8FA3">MCP</text>
    <rect x="620" y="360" width="150" height="44" rx="22" fill="#15233A" stroke="#5B8CFF"/>
    <text x="645" y="389" fill="#C7D7FF">OpenAPI</text>
  </g>

  <text x="96" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#5B6B82">github.com/dallascrilley/trifold</text>
</svg>
